
name: Android CI

on:
  push:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_NEXT_KEYSTORE_PASSWORD }}
      MOJOPUB_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_NEXT_KEYSTORE_PASSWORD }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: true

      # Download LTW
      - name: Get LTW
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          repo: MojoLauncher/LTW
          workflow: android.yml
          workflow_conclusion: success
          name: output-aar
          path: app_mojo/libs

      # Download Mesa
      - name: Get Mesa
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          repo: CopperLauncher/Mesa-AAR-Builder
          workflow: build-aar.yml
          workflow_conclusion: success
          name: mesa.aar
          path: app_mojo/libs

      # Gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.5"

      # Java
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'

      - name: Create output directory
        run: mkdir -p out

      # Release signing
      - name: Prepare Release Keystore
        if: github.event_name != 'pull_request'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_NEXT_KEYSTORE_PASSWORD }}
        run: |
          set -e

          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::Missing RELEASE_KEYSTORE_BASE64 secret"
            exit 1
          fi

          if [ -z "$RELEASE_KEYSTORE_PASSWORD" ]; then
            echo "::error::Missing RELEASE_NEXT_KEYSTORE_PASSWORD secret"
            exit 1
          fi

          printf '%s' "$RELEASE_KEYSTORE_BASE64" \
            | base64 --decode > app_mojo/mojo_release_next.jks

          if [ ! -s app_mojo/mojo_release_next.jks ]; then
            echo "::error::Keystore file is empty"
            exit 1
          fi

          echo "Verifying release keystore..."

          keytool -list \
            -keystore app_mojo/mojo_release_next.jks \
            -storepass "$RELEASE_KEYSTORE_PASSWORD" \
            -alias key0

          echo "Release keystore successfully verified."

      # Google Play upload key
      - name: Decode upload keystore
        if: github.repository_owner == 'CopperLauncher' && (github.ref == 'refs/heads/v3_openjdk' || startsWith(github.ref, 'refs/tags/v'))
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$UPLOAD_KEYSTORE_BASE64" ]; then
            printf '%s' "$UPLOAD_KEYSTORE_BASE64" \
              | base64 --decode > app_mojo/mojo_upload_next.jks
          fi

      # Google Play AAB
      - name: Build Publishing .aab
        if: github.repository_owner == 'CopperLauncher' && (github.ref == 'refs/heads/v3_openjdk' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          gradle :app_mojo:bundleFullGplay
          mv app_mojo/build/outputs/bundle/fullGplay/app_mojo-full-gplay.aab out/app-gplay.aab

      # Debug Full APK
      - name: Build Debug .apk
        run: |
          gradle :app_mojo:assembleFullDebug
          mv app_mojo/build/outputs/apk/full/debug/app_mojo-full-debug.apk out/app-debug-full.apk

      # Debug No Runtime APK
      - name: Build Debug .apk (No runtime)
        run: |
          gradle :app_mojo:assembleNoruntimeDebug
          mv app_mojo/build/outputs/apk/noruntime/debug/app_mojo-noruntime-debug.apk out/app-debug-noruntime.apk

      # Release APK
      - name: Build Release .apk
        if: github.event_name != 'pull_request'
        run: |
          gradle :app_mojo:assembleFullPubRelease
          mv app_mojo/build/outputs/apk/full/pubRelease/app_mojo-full-pubRelease.apk out/Copper-release.apk

      # MD5 Checksums
      - name: Gen md5sums
        run: |
          md5sum out/app-debug-full.apk > out/app-debug-full.md5
          md5sum out/app-debug-noruntime.apk > out/app-debug-noruntime.md5

          if [ -f out/Copper-release.apk ]; then
            md5sum out/Copper-release.apk > out/Copper-release.md5
          fi

      # Upload Debug Full
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            out/app-debug-full.apk
            out/app-debug-full.md5

      # Upload Debug No Runtime
      - name: Upload Debug APK (No runtime)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-noruntime
          path: |
            out/app-debug-noruntime.apk
            out/app-debug-noruntime.md5

      # Upload Release
      - name: Upload Release APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            out/Copper-release.apk
            out/Copper-release.md5

      # Upload AAB
      - name: Upload AAB
        if: github.repository_owner == 'CopperLauncher' && (github.ref == 'refs/heads/v3_openjdk' || startsWith(github.ref, 'refs/tags/v'))
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: out/app-gplay.aab

      # Nightly Release
      - name: Release Nightly APK
        if: github.repository_owner == 'CopperLauncher' && github.ref == 'refs/heads/v3_openjdk'
        uses: softprops/action-gh-release@v3
        with:
          name: Copper Nightly Builds
          prerelease: true
          tag_name: nightly
          body: |
            Copper nightly build.
            Commit hash: ${{ github.sha }}
          files: |
            out/Copper-release.apk

      # Google Play Testing Track
      - name: Upload onto the Google Play testing track
        continue-on-error: true
        if: github.repository_owner == 'CopperLauncher' && github.ref == 'refs/heads/v3_openjdk'
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_JSON }}
          packageName: com.maxjubayeryt.copper
          releaseFiles: out/app-gplay.aab
          track: internal
          inAppUpdatePriority: 5
